[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bahts-rust-experiment"
dynamic = ["version"]
description = "Opt-in normalization experiment for mesin-bahts"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

[tool.maturin]
module-name = "_bahts_rust"
strip = true
