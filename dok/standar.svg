<text x="466" y="242" font-size="14.5" font-weight="700" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#1f2f57">العلمية وكتابتها وطباعتها وتقديمها</text>
<text x="78" y="222" font-size="12.5" fill="#5e4835">Jāmiʿat al-Imām, disahkan</text>
<text x="78" y="239" font-size="12.5" fill="#5e4835">tahun 1442 H. Untuk tesis;</text>
<text x="78" y="256" font-size="12.5" fill="#5e4835">dipakai juga di bahts kelas.</text>
