<rect x="1475.0" y="449" width="53.6" height="21" rx="10.5" fill="#efe6d6" stroke="#8a7258"/><text x="1501.8" y="463.6" font-size="11.5" font-weight="700" fill="#5a4733" text-anchor="middle">Mesin</text>
<text x="1056.0" y="484" font-size="14" fill="#3a281b">ayat (urut mushaf), hadits (urut abjad), isi</text>
<text x="1056.0" y="500" font-size="11.5" fill="#8a735c">kampus: «menurut kebiasaan tiap bidang»; daftar pastinya belum ada sumber tertulis</text>
