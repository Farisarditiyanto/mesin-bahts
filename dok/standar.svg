<text x="536.0" y="414" font-size="14" fill="#3a281b">rasm Utsmani, huruf mushaf KFGQPC, ukuran 16</text>
<text x="536.0" y="430" font-size="11.5" fill="#8a735c">kampus: sama dengan isi (18); mesin 16 supaya tidak tampak lebih besar</text>
