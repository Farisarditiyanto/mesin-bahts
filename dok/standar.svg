<rect x="1475.0" y="379" width="53.6" height="21" rx="10.5" fill="#efe6d6" stroke="#8a7258"/><text x="1501.8" y="393.6" font-size="11.5" font-weight="700" fill="#5a4733" text-anchor="middle">Mesin</text>
<rect x="1414.0" y="379" width="53.6" height="21" rx="10.5" fill="#f8e3e6" stroke="#c0566e"/><text x="1440.8" y="393.6" font-size="11.5" font-weight="700" fill="#7d2f42" text-anchor="middle">Dosen</text>
<text x="1056.0" y="414" font-size="14" fill="#3a281b">tabel tanpa garis, urut abjad, القرآن الكريم paling atas</text>
<rect x="1040.0" y="442" width="500.0" height="66" rx="8" fill="#fffaf0" fill-opacity="0.75"/>
<rect x="1040.0" y="452" width="3" height="46" rx="1.5" fill="#b8892f" opacity="0.7"/>
