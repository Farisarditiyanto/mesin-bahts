<rect x="260" y="318" width="216" height="94" rx="6" fill="#fffaf0" stroke="#c0566e" stroke-opacity="0.45"/>
<text x="466" y="356" font-size="14.5" font-weight="700" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#7d2f42">تنبيهات مهمة في البحوث الصفية</text>
<text x="466" y="386" font-size="14.5" font-weight="700" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#7d2f42">الملاحظات التي ينبغي مراعاتها</text>
<text x="78" y="366" font-size="12.5" fill="#5e4835">Dosen bahts kelas di Ma'had</text>
<text x="78" y="383" font-size="12.5" fill="#5e4835">Jakarta, tahun ajaran</text>
<text x="78" y="400" font-size="12.5" fill="#5e4835">1447 H. Merujuk ke aturan</text>
<text x="78" y="417" font-size="12.5" fill="#5e4835">kampus di atas.</text>
<rect x="60" y="438" width="430" height="116" rx="12" fill="#fbf5e8" stroke="#8a7258" stroke-width="1.4" filter="url(#bayang)"/>
<path d="M60 450Q60 438 72 438H478Q490 438 490 450Z" fill="#8a7258"/>
<circle cx="86" cy="480" r="8" fill="#8a7258"/><text x="102" y="486" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Pilihan mesin</text>
<text x="78" y="508" font-size="13" fill="#5e4835">Tidak disebut dua sumber itu, atau hanya</text>
<text x="78" y="526" font-size="13" fill="#5e4835">disebut garis besarnya. Bisa diubah lewat</text>
<text x="78" y="544" font-size="13" fill="#5e4835">mesin/format.json.</text>
<rect x="60" y="570" width="430" height="170" rx="12" fill="#f6e0e1" stroke="#9a3040" stroke-width="1.3"/>
<text x="78" y="598" font-size="16" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#6e1f2c">Bukan standar kementerian</text>
<text x="78" y="620" font-size="12.5" fill="#5e4835">Aturan bentuk halaman disahkan dewan pascasarjana kampus</text>
<text x="78" y="637" font-size="12.5" fill="#5e4835">(عمادة الدراسات العليا), bukan oleh kementerian.</text>
<text x="78" y="657" font-size="12.5" fill="#5e4835">وزارة التعليم di sampul hanya baris kop yang diminta aturan</text>
<text x="78" y="674" font-size="12.5" fill="#5e4835">kampus itu, di atas nama kampus.</text>
<text x="78" y="694" font-size="11.5" font-style="italic" fill="#8a735c">Aturan kampus menyebut dasarnya:</text>
<text x="78" y="710" font-size="11.5" font-style="italic" fill="#8a735c">اللائحة الموحدة للدراسات العليا في الجامعات. Isi peraturan dasar</text>
<text x="78" y="726" font-size="11.5" font-style="italic" fill="#8a735c">itu belum dicek.</text>
<text x="520" y="148" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Yang dipakai mesin</text>
