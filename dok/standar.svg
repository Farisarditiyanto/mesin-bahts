<text x="60" y="84" font-size="34" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Aturan tulisan dan tata letak: dari mana asalnya</text>
<text x="60" y="116" font-size="17" fill="#5e4835">Tiap aturan di mesin punya sumber. Warnanya menunjukkan sumber yang mana.</text>
