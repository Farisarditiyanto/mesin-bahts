<text x="1056.0" y="274" font-size="14" fill="#3a281b">مقدمة ← فصول ومباحث ← خاتمة ← المصادر والمراجع ← الفهارس</text>
<rect x="1040.0" y="302" width="500.0" height="66" rx="8" fill="#fffaf0" fill-opacity="0.75"/>
<rect x="1040.0" y="312" width="3" height="46" rx="1.5" fill="#b8892f" opacity="0.7"/>
