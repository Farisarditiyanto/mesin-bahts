<text x="1056.0" y="360" font-size="11.5" fill="#8a735c">kampus juga menyebut مبحث; mesin hanya فصل</text>
<rect x="1040.0" y="382" width="3" height="46" rx="1.5" fill="#b8892f" opacity="0.7"/>
