<rect x="886.6" y="589" width="60.8" height="21" rx="10.5" fill="#e4e8f3" stroke="#2f4478"/><text x="917.0" y="603.6" font-size="11.5" font-weight="700" fill="#1f2f57" text-anchor="middle">Kampus</text>
