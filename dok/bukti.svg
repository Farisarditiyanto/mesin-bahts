<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Cara cek membuktikan kutipan: bukti di catatan kaki dicocokkan ke halaman kitab</title>
<defs><linearGradient id="kertas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7ecd6"/><stop offset="1" stop-color="#efdfbf"/></linearGradient><radialGradient id="sinar" cx="0.78" cy="0.12" r="0.7"><stop offset="0" stop-color="#fff6dc" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient><linearGradient id="kayu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4429"/><stop offset="1" stop-color="#3f2717"/></linearGradient><filter id="bayang" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a3a1e" flood-opacity="0.18"/></filter><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#8a735c"/></marker><marker id="pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#9a3040"/></marker><marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#b8892f"/></marker></defs>
<rect width="1600" height="800" rx="22" fill="url(#kayu)"/>
