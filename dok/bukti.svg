<rect x="12" y="12" width="1576" height="776" rx="14" fill="url(#sinar)"/>
<rect x="22" y="22" width="1556" height="756" rx="10" fill="none" stroke="#b8892f" stroke-width="1.5" stroke-opacity="0.75"/>
<rect x="28" y="28" width="1544" height="744" rx="7" fill="none" stroke="#b8892f" stroke-width="0.8" stroke-opacity="0.45"/>
<path d="M28 58Q34 34 58 28" fill="none" stroke="#b8892f" stroke-width="1.6"/><path d="M38 38l5 -5l5 5l-5 5z" fill="#b8892f"/>
<path d="M1572 58Q1566 34 1542 28" fill="none" stroke="#b8892f" stroke-width="1.6"/><path d="M1562 38l-5 -5l-5 5l5 5z" fill="#b8892f"/>
<path d="M28 742Q34 766 58 772" fill="none" stroke="#b8892f" stroke-width="1.6"/><path d="M38 762l5 5l5 -5l-5 -5z" fill="#b8892f"/>
<path d="M1572 742Q1566 766 1542 772" fill="none" stroke="#b8892f" stroke-width="1.6"/><path d="M1562 762l-5 5l-5 -5l5 -5z" fill="#b8892f"/>
<text x="60" y="84" font-size="34" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Cara cek menangkap kutipan karangan</text>
<text x="60" y="116" font-size="17" fill="#5e4835">Mesin membuka alamat di catatan kaki dan mencari kalimatnya; tanda baca sesudah petik tidak melewati pemeriksaan.</text>
<rect x="60" y="150" width="440" height="440" rx="14" fill="#fbf5e8" stroke="#2f4478" stroke-width="1.4" filter="url(#bayang)"/>
<path d="M60 164Q60 150 74 150H486Q500 150 500 164Z" fill="#2f4478"/>
<rect x="78.0" y="180" width="89.3" height="22" rx="11.0" fill="#2f4478"/><text x="122.7" y="195.1" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">naskah.txt</text>
<text x="184" y="196" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Yang ditulis agent</text>
<rect x="80" y="240" width="400" height="108" rx="8" fill="#fffaf0" stroke="#e6c97a"/>
<text x="464" y="282" font-size="22" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#3a281b">«ثلاث لا يغل عليهن قلب مسلم</text>
<text x="464" y="322" font-size="22" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#3a281b">إخلاص العمل لله»</text>
<text x="480" y="380" font-size="13.5" fill="#8a735c" text-anchor="end">catatan kakinya menyimpan bukti (tidak ikut tercetak):</text>
<rect x="155" y="402" width="250" height="44" rx="8" fill="#fffaf0" stroke="#2f4478" stroke-width="1.4"/><text x="280" y="432" font-size="22" font-weight="700" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f2f57">&lt;&lt;30148|-|36&gt;&gt;</text>
<path d="M225 450V472" stroke="#2f4478"/><text x="215" y="488" font-size="13" fill="#1f2f57" text-anchor="middle">nomor kitab</text>
<path d="M286 450V500" stroke="#2f4478"/><text x="286" y="516" font-size="13" fill="#1f2f57" text-anchor="middle">juz (- = satu jilid)</text>
<path d="M328 450V472" stroke="#2f4478"/><text x="360" y="488" font-size="13" fill="#1f2f57" text-anchor="middle">halaman</text>
<path d="M508 370.0H572" stroke="#b8892f" stroke-width="2.4" marker-end="url(#pg)"/>
<text x="540" y="358.0" font-size="15" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#1c4636" text-anchor="middle">cek</text>
<path d="M540 391.0Q540 398.0 547 398.0Q540 398.0 540 405.0Q540 398.0 533 398.0Q540 398.0 540 391.0Z" fill="#b8892f" opacity="0.7"/>
<rect x="580" y="150" width="440" height="440" rx="14" fill="#fbf5e8" stroke="#2f6650" stroke-width="1.4" filter="url(#bayang)"/>
<path d="M580 164Q580 150 594 150H1006Q1020 150 1020 164Z" fill="#2f6650"/>
<rect x="598.0" y="180" width="53.6" height="22" rx="11.0" fill="#2f6650"/><text x="624.8" y="195.1" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Mesin</text>
<text x="668" y="196" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Kitab 30148, halaman 36</text>
<text x="598" y="226" font-size="13" fill="#8a735c">teks Shamela yang sudah diunduh ke komputermu</text>
<rect x="610" y="256" width="392" height="310" rx="4" fill="#e8d6b2"/><rect x="604" y="250" width="392" height="310" rx="4" fill="#fffaf0" stroke="#d6c39b"/><rect x="614" y="260" width="372" height="290" rx="2" fill="none" stroke="#e6c97a" stroke-dasharray="2 3"/>
<text x="970" y="294" font-size="19" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#8a735c">لماذا التوحيد أولا؟ — ص36</text>
<text x="970" y="340" font-size="19" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#5e4835">... عبد الله بن مسعود ...</text>
<rect x="624" y="360" width="352" height="84" rx="4" fill="#f6dc8e" opacity="0.85"/>
<text x="970" y="392" font-size="20" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#3a281b">«ثلاث لا يغل عليهن قلب مسلم</text>
<text x="970" y="428" font-size="20" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#3a281b">إخلاص العمل لله،</text>
<text x="970" y="482" font-size="19" font-weight="400" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" direction="rtl" text-anchor="start" fill="#5e4835">ومناصحة ولاة الأمر ...</text>
<text x="1060" y="164" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#3a281b">Tiga kemungkinan hasil</text>
<text x="1060" y="186" font-size="13" fill="#8a735c">keluaran cek yang sebenarnya</text>
<rect x="1060" y="204" width="480" height="166" rx="12" fill="#e2eee6" stroke="#2f6650" stroke-width="1.3" filter="url(#bayang)"/>
<circle cx="1090" cy="236" r="16" fill="#2f6650"/><text x="1090" y="243" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">✓</text>
<text x="1116" y="242" font-size="16" font-weight="700" fill="#3a281b">Kalimatnya ada di halaman itu</text>
<text x="1078" y="268" font-size="13" fill="#5e4835">lolos, dihitung di «bukti dicek ke Shamela lokal»</text>
<rect x="1074" y="336" width="452" height="24" rx="5" fill="#fffaf0" stroke="#2f6650" stroke-opacity="0.4"/>
<text x="1084" y="353" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#1c4636">bukti dicek ke Shamela lokal: 1 | GAGAL: 0</text>
<rect x="1060" y="384" width="480" height="166" rx="12" fill="#f6e0e1" stroke="#9a3040" stroke-width="1.3" filter="url(#bayang)"/>
<circle cx="1090" cy="416" r="16" fill="#9a3040"/><text x="1090" y="423" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">✗</text>
<text x="1116" y="422" font-size="16" font-weight="700" fill="#3a281b">Kalimatnya dikarang</text>
<text x="1078" y="448" font-size="13" fill="#5e4835">tidak ada di kitab itu: agent membuangnya. Kalau hanya</text>
<text x="1078" y="466" font-size="13" fill="#5e4835">satu kata yang salah, mesin menyebut kata itu dan</text>
<text x="1078" y="484" font-size="13" fill="#5e4835">kata yang tertulis di kitab</text>
<text x="1078" y="502" font-size="13" fill="#5e4835">Kalau teksnya ada di kitab lain: cek --jejak</text>
<rect x="1074" y="516" width="452" height="24" rx="5" fill="#fffaf0" stroke="#9a3040" stroke-opacity="0.4"/>
<text x="1084" y="533" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#6e1f2c">✗ baris 8: teks TIDAK KETEMU di kitab 30148</text>
<rect x="1060" y="564" width="480" height="166" rx="12" fill="#f6e0e1" stroke="#9a3040" stroke-width="1.3" filter="url(#bayang)"/>
<circle cx="1090" cy="596" r="16" fill="#9a3040"/><text x="1090" y="603" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">✗</text>
<text x="1116" y="602" font-size="16" font-weight="700" fill="#3a281b">Kalimatnya ada, halamannya salah</text>
<text x="1078" y="628" font-size="13" fill="#5e4835">ditulis halaman 99; mesin menyebut letak yang benar:</text>
<text x="1078" y="646" font-size="13" fill="#5e4835">tanpa juz, halaman 36</text>
<rect x="1074" y="696" width="452" height="24" rx="5" fill="#fffaf0" stroke="#9a3040" stroke-opacity="0.4"/>
<text x="1084" y="713" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#6e1f2c">✗ baris 10: teks TIDAK di -/99; ketemu di</text>
<text x="1410" y="714" font-size="14" font-family="Traditional Arabic, Amiri, Noto Naskh Arabic, Segoe UI, sans-serif" fill="#6e1f2c">ج- ص36</text>
<text x="1468" y="713" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#6e1f2c">(30148)</text>
<rect x="60" y="614" width="960" height="126" rx="12" fill="#f8e3e6" stroke="#c0566e" stroke-width="1.3"/>
<text x="82" y="646" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#7d2f42">Yang TIDAK bisa dinilai cek</text>
<text x="82" y="674" font-size="14" fill="#5e4835">Benarkah yang berkata memang orang itu, benarkah nama kitabnya, derajat hadits, kutipan tanpa catatan kaki,</text>
<text x="82" y="696" font-size="14" fill="#5e4835">dan isi sumber di luar Shamela. Itu tugas agent kedua (langkah 9), lalu kamu.</text>
<text x="82" y="720" font-size="13" fill="#5e4835">#nomor tidak boleh mengambil kepala dari halaman mendatang. Salah ketik @kunci dan blok sesudah #R ditolak.</text>
