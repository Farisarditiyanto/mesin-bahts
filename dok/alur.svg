<text x="221.6" y="408" font-size="17" font-weight="700" fill="#22211f">Jawab data sampul</text>
<text x="166" y="433" font-size="13.5" fill="#3d3c38">Nama, NIM, jenis tugas, semester: ditanya sekali, lalu diingat.</text>
<text x="166" y="452" font-size="13.5" fill="#3d3c38">Pembimbing: ditanya tiap bahts.</text>
