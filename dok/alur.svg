<rect x="150" y="948" width="810" height="88" rx="12" fill="#e3f4ec" stroke="#16805f" stroke-width="1.2"/>
<rect x="166" y="962" width="53.0" height="20" rx="10" fill="#16805f"/><text x="192.5" y="976" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Mesin</text>
<text x="229.0" y="978" font-size="17" font-weight="700" fill="#22211f">rakit: Word + PDF</text>
<text x="166" y="1003" font-size="13.5" fill="#3d3c38">Sampul, isi, catatan kaki, daftar pustaka (المصادر والمراجع), dan فهرس ayat, hadits, isi.</text>
<text x="166" y="1022" font-size="13.5" fill="#3d3c38">Butuh Windows + Microsoft Word.</text>
<rect x="895.5" y="961" width="50.5" height="22" rx="5" fill="#ffffff" stroke="#16805f" stroke-opacity="0.55"/><text x="920.75" y="976.5" font-size="12" font-family="Consolas, Menlo, monospace" fill="#0d5640" text-anchor="middle">rakit</text>
<circle cx="118" cy="1105" r="15" fill="#2f6db5"/><text x="118" y="1110" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<rect x="150" y="1062" width="810" height="88" rx="12" fill="#e7f0fb" stroke="#2f6db5" stroke-width="1.2"/>
<rect x="166" y="1076" width="75.2" height="20" rx="10" fill="#2f6db5"/><text x="203.6" y="1090" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Agent AI</text>
<text x="251.2" y="1092" font-size="17" font-weight="700" fill="#22211f">Diperiksa agent kedua</text>
<text x="166" y="1117" font-size="13.5" fill="#3d3c38">Agent baru yang tidak ikut menulis membuka halaman tiap catatan kaki dan membaca PDF-nya:</text>
<text x="166" y="1136" font-size="13.5" fill="#3d3c38">benarkah yang berkata orang itu, benarkah nama kitabnya, sesuaikah dengan permintaanmu.</text>
<circle cx="118" cy="1219" r="15" fill="#c9831f"/><text x="118" y="1224" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10</text>
<rect x="150" y="1176" width="810" height="88" rx="12" fill="#fdf1de" stroke="#c9831f" stroke-width="1.2"/>
<rect x="166" y="1190" width="45.6" height="20" rx="10" fill="#c9831f"/><text x="188.8" y="1204" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Kamu</text>
<text x="221.6" y="1206" font-size="17" font-weight="700" fill="#22211f">Baca, periksa kutipan utama, kumpulkan</text>
<text x="166" y="1231" font-size="13.5" fill="#3d3c38">PDF untuk dibaca dan dikumpulkan; .docx untuk dibuka di Word.</text>
