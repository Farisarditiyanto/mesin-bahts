<rect x="166" y="278" width="75.2" height="20" rx="10" fill="#2f6db5"/><text x="203.6" y="292" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Agent AI</text>
<text x="251.2" y="294" font-size="17" font-weight="700" fill="#22211f">Siapkan komputer (sekali saja)</text>
<text x="166" y="319" font-size="13.5" fill="#3d3c38">Unduh repo, periksa apa yang kurang, unduh katalog kitab dan font mushaf.</text>
<text x="166" y="338" font-size="13.5" fill="#3d3c38">Di Windows, font mushaf langsung dipasang.</text>
