<rect x="166" y="506" width="75.2" height="20" rx="10" fill="#2f6db5"/><text x="203.6" y="520" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Agent AI</text>
<text x="251.2" y="522" font-size="17" font-weight="700" fill="#22211f">Susun rencana</text>
<text x="166" y="547" font-size="13.5" fill="#3d3c38">Buat folder bahts dan susun kerangka bab (خطة) sesuai permintaan dosen.</text>
