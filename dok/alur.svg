<rect x="166" y="848" width="53.0" height="20" rx="10" fill="#16805f"/><text x="192.5" y="862" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Mesin</text>
<text x="229.0" y="864" font-size="17" font-weight="700" fill="#22211f">cek: cocokkan tiap kutipan ke kitab</text>
<text x="166" y="889" font-size="13.5" fill="#3d3c38">Kutipan yang tidak ada di halaman itu = GAGAL. Kalau ada di halaman lain, letaknya disebut.</text>
<text x="166" y="908" font-size="13.5" fill="#3d3c38">Lanjut hanya kalau GAGAL: 0.</text>
