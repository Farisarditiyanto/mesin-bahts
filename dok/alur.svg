<text x="251.2" y="750" font-size="17" font-weight="700" fill="#22211f">Tulis naskah.txt</text>
<text x="166" y="775" font-size="13.5" fill="#3d3c38">Tiap kutipan diberi catatan kaki + alamatnya: nomor kitab, juz, halaman.</text>
<text x="166" y="794" font-size="13.5" fill="#3d3c38">Ayat cukup ditulis nomornya; teksnya diambil dari mushaf resmi.</text>
<rect x="859.0" y="733" width="87.0" height="22" rx="5" fill="#ffffff" stroke="#2f6db5" stroke-opacity="0.55"/><text x="902.5" y="748.5" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c4a80" text-anchor="middle">naskah.txt</text>
