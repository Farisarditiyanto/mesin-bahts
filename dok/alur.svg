<text x="221.6" y="180" font-size="17" font-weight="700" fill="#22211f">Minta bahts</text>
<text x="166" y="205" font-size="13.5" fill="#3d3c38">Tempel satu kalimat: judul, susunan bab, kira-kira berapa halaman.</text>
