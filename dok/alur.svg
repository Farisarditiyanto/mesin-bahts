<text x="970" y="826" font-size="12" font-weight="700" fill="#b3362f" text-anchor="end">ada yang salah? kembali menulis, lalu cek dan rakit ulang</text>
<text x="150" y="1306" font-size="13" fill="#6b6a65">Tanpa Windows atau Word, langkah 8 dilewati: naskah tetap dicek dan diperiksa agent kedua, tetapi Word dan PDF tidak dibuat.</text>
