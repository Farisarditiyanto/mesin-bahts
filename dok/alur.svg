<rect x="166" y="620" width="75.2" height="20" rx="10" fill="#2f6db5"/><text x="203.6" y="634" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Agent AI</text>
<text x="251.2" y="636" font-size="17" font-weight="700" fill="#22211f">Cari dan baca bahan</text>
<text x="166" y="661" font-size="13.5" fill="#3d3c38">Cari kitab yang membahas, unduh ke komputer, salin teks persis + data cetaknya.</text>
<text x="166" y="680" font-size="13.5" fill="#3d3c38">Takhrij hadits dan penelitian terdahulu (الدراسات السابقة) juga dicari.</text>
