name: paket-rust-eksperimen
on:
  push:
    branches: [claude/rust-experiment]
    paths: ["dok/eksperimen-rust/**", ".github/workflows/eksperimen-rust.yml"]
  pull_request:
    paths: ["dok/eksperimen-rust/**", ".github/workflows/eksperimen-rust.yml"]
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: "3.14"
      - run: python -m pip install maturin
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: rustup default 1.99.1
      - name: Build wheel; install and verify without Rust in fresh Python 3.12 and 3.14
        run: python dok/eksperimen-rust/paket.py --out wheel-results --interpreter "${{ steps.py312.outputs.python-path }}" --interpreter "${{ steps.py314.outputs.python-path }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.os }}
          path: wheel-results/
