name: tes
on: [push, pull_request]
jobs:
  cek-contoh:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]  # pemakai Windows sampai `rakit`; Linux/macOS berhenti di `cek`
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mesin/bahts.py siapkan
      - run: python mesin/bahts.py periksa
      - run: python mesin/bahts.py ambil 11223
      - run: python mesin/bahts.py cek contoh
      # contoh/jebakan/naskah.txt: tiap baris di bawah #S menghasilkan persis yang disebut judulnya
      - run: python .github/uji_jebakan.py
      # tanpa @angka, angka di teks Arab bahan rakit ٠-٩ (dulu PDF mencetak «آية: ٢» di samping «ص5»)
      - run: python .github/uji_angka.py
      # rakit.ps1 tidak bisa dijalankan tanpa Word; minimal harus terurai oleh Windows PowerShell 5.1 milik pemakai
      - name: urai rakit.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $galat = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\mesin\rakit.ps1", [ref]$null, [ref]$galat) | Out-Null
          if ($galat) { $galat | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
