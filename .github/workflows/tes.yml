name: tes
on: [push, pull_request]
jobs:
  cek-contoh:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]  # pemakai Windows sampai `rakit`; Linux/macOS berhenti di `cek`
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mesin/bahts.py siapkan
      - run: python mesin/bahts.py periksa
      # 11223 = kitab contoh/naskah.txt; sisanya untuk jebakan yang butuh kitab berharakat, berjilid, atau berhalaman rumit
      - run: python mesin/bahts.py ambil 11223 2348 1082 10649 1727 1681
      - run: python mesin/bahts.py cek contoh
      # contoh/jebakan/naskah.txt: tiap baris di bawah #S menghasilkan persis yang disebut judulnya
      - run: python .github/uji_jebakan.py
      # tanpa @angka, angka di teks Arab bahan rakit ٠-٩ (dulu PDF mencetak «آية: ٢» di samping «ص5»)
      - run: python .github/uji_angka.py
      # Pengalihan HTTP harus menjaga kunci di asal yang sama, tanpa membocorkannya ke asal lain (peladen lokal).
      - run: python .github/uji_jaringan.py
      # Bahan terpisah, cache rusak pulih, sumber tidak tertimpa, katalog ringan, PDF utuh; kegagalan Word disimulasikan.
      - run: python .github/uji_integritas.py
      # Struktur yang diterima cek harus seluruhnya dapat dirakit; stress catatan kaki dan data salah ketik.
      - run: python .github/uji_struktur.py
      # opencode.json = salinan terpaksa .mcp.json (OpenCode tidak membaca .mcp.json): daftar connector harus sama
      - name: connector opencode.json sama dengan .mcp.json
        run: python -c "import json; a={k:v['url'] for k,v in json.load(open('.mcp.json'))['mcpServers'].items()}; b={k:v['url'] for k,v in json.load(open('opencode.json'))['mcp'].items()}; assert a==b, (a,b)"
      # rakit.ps1 tidak bisa dijalankan tanpa Word; minimal harus terurai oleh Windows PowerShell 5.1 milik pemakai
      - name: urai rakit.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $galat = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\mesin\rakit.ps1", [ref]$null, [ref]$galat) | Out-Null
          if ($galat) { $galat | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - name: startup rakit tidak menghentikan Word aplikasi lain
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/uji_word_startup.ps1
