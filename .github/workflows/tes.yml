name: tes
on: [push, pull_request]
jobs:
  cek-contoh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mesin/bahts.py siapkan
      - run: python mesin/bahts.py periksa
      - run: python mesin/bahts.py ambil 11223
      - run: python mesin/bahts.py cek contoh
      # tiap baris contoh/jebakan/naskah.txt memuat satu kesalahan: GAGAL harus sama dengan @jebakan di naskah itu
      - name: cek jebakan
        shell: pwsh
        run: |
          $keluar = python mesin/bahts.py cek contoh/jebakan
          $keluar
          $harus = [int][regex]::Match((Get-Content contoh/jebakan/naskah.txt -Raw -Encoding utf8), '(?m)^@jebakan:\s*(\d+)').Groups[1].Value
          $ada = [regex]::Match(($keluar -join "`n"), 'GAGAL: (\d+)')
          if (-not $ada.Success) { throw "cek jebakan berhenti sebelum laporan GAGAL" }
          if ([int]$ada.Groups[1].Value -ne $harus) { throw "cek jebakan: GAGAL $($ada.Groups[1].Value), harusnya $harus" }
          exit 0
