name: tes
on: [push, pull_request]
jobs:
  cek-contoh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mesin/bahts.py siapkan
      - run: python mesin/bahts.py periksa
      - run: python mesin/bahts.py ambil 11223
      - run: python mesin/bahts.py cek contoh
      # contoh/jebakan/naskah.txt: tiap baris jebakan satu kesalahan (GAGAL = @jebakan),
      # tiap baris di bawah #S satu perhatian (perhatian = @perhatian_jebakan)
      - name: cek jebakan
        shell: pwsh
        run: |
          $keluar = (python mesin/bahts.py cek contoh/jebakan) -join "`n"
          $keluar
          $naskah = Get-Content contoh/jebakan/naskah.txt -Raw -Encoding utf8
          foreach ($p in @(@('jebakan', 'GAGAL: (\d+)'), @('perhatian_jebakan', 'perhatian \(lolos, tetapi lihat sendiri\): (\d+)'))) {
            $harus = [int][regex]::Match($naskah, "(?m)^@$($p[0]):\s*(\d+)").Groups[1].Value
            $ada = [regex]::Match($keluar, $p[1])
            if (-not $ada.Success) { throw "cek jebakan berhenti sebelum laporan $($p[0])" }
            if ([int]$ada.Groups[1].Value -ne $harus) { throw "cek jebakan: $($p[0]) $($ada.Groups[1].Value), harusnya $harus" }
          }
          exit 0
