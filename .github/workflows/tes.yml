name: tes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  cek-contoh:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]  # pemakai Windows sampai `rakit`; Linux/macOS berhenti di `cek`
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # durasi riil CI 3-4 menit; 20 = aman buat putaran yang lambat
    steps:
      - uses: actions/checkout@v7
      # cache kitab: unduhan Shamela ±18 MB dijamin antar putaran; `ambil` tetap fallback idempoten (sudah ada = skip)
      - uses: actions/cache@v6
        with:
          path: kitab/
          key: kitab-${{ runner.os }}-${{ hashFiles('.github/workflows/tes.yml') }}
          restore-keys: kitab-${{ runner.os }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"  # requirements.txt di akar; unduhan pip di-cache antar putaran
      - run: pip install -r requirements.txt
      - run: python mesin/bahts.py siapkan
      - run: python mesin/bahts.py periksa
      # 11223 = kitab contoh/naskah.txt; sisanya untuk jebakan yang butuh kitab berharakat, berjilid, berhalaman rumit, atau berderajat (1726 سنن أبي داود: derajat tiap hadits di حاشية-nya);
      # 9904 dan 11825: حاشية المحقق yang tertulis di body sesudah garis ___ (footnotes kosong)
      # 654/711 = سنن أبي داود/صحيح مسلم edisi pilihan layanan takhrij Shamela: jembatan nomor hadits ke 1726/1727 (uji_layanan);
      # 2170/1278 = الجرح والتعديل/تهذيب التهذيب: tempat ucapan جرح وتعديل `rawi` (uji_layanan)
      # (11797 = kitab yang bagiannya hanya bernama: المقدمة + الكتاب; 7283 القاموس المحيط = kamus yang dirujuk lewat «مادة»)
      - run: python mesin/bahts.py ambil 11223 2348 1082 10649 1727 1681 9904 11825 1726 11797 7283 654 711 2170 1278 12286
      - run: python mesin/bahts.py cek contoh
      # contoh/jebakan/naskah.txt: tiap baris di bawah #S menghasilkan persis yang disebut judulnya
      - run: python .github/uji_jebakan.py
      # .github/uji_pemeriksa: jebakan untuk pemeriksa langkah 5 harus tetap lolos `cek` (yang tertangkap `cek` tidak mengukur pemeriksa)
      - run: python .github/uji_pemeriksa.py
      # cek --jejak: kutipan yang salah kitab ditunjuk di kitab lain yang sudah diunduh, tanpa mengubah putusan cek
      - run: python .github/uji_jejak.py
      # bukti: teks kitab yang dicetak dari halaman yang dirujuk (bukan halaman lain), ayat persis, hanya baris yang diminta
      - run: python .github/uji_bukti.py
      # tanpa @angka, semua angka di teks Arab bahan rakit ٠-٩ (bukan «آية: ٢» di samping «ص5»)
      - run: python .github/uji_angka.py
      # Pengalihan HTTP harus menjaga kunci di asal yang sama, tanpa membocorkannya ke asal lain (peladen lokal).
      - run: python .github/uji_jaringan.py
      # `dirasat` & `dirasat-pdf` tiruan (tanpa internet): --dari/--sampai/--bahasa/--urut, biblio, dedup judul, lookup W…/DOI, fallback OA PDF.
      - run: python .github/uji_dirasat.py
      # Audit silang #R, generator `pustaka`, dan pemulihan teks PDF Arab visual-reversed.
      - run: python .github/uji_pustaka_pdf.py
      # `ubah`: diff revisi baris dan konservasi token (bukti, penanda, angka, syarat fikih) tanpa internet.
      - run: python .github/uji_revisi.py
      # Cache dan indeks rusak pulih, sumber tidak tertimpa, PDF unduhan utuh, hasil lama utuh saat rakit gagal; Word disimulasikan.
      - run: python .github/uji_integritas.py
      # Pemeriksaan PDF sesudah rakit: isian «....» dan @judul di sampul, nomor halaman 0123/٠١٢٣, pengantar «:» di dasar halaman
      - run: python .github/uji_pdf.py
      # Putusan `cek` atas @data, judul, riset.txt, dan الدراسات السابقة; `baru` dan `tahap`; beban 2000 nukilan.
      - run: python .github/uji_struktur.py
      # `tahap` tidak menulis apa pun, laporan rusak, pembersihan folder .rakit-* (tautan, terkunci), judul bagian, gelar.
      - run: python .github/uji_audit.py
      # Regresi nomor {P:} pada PDF Word asli; runner tanpa Word melaporkan lewati, PC ber-Word menjalankannya.
      - run: python .github/uji_rujukan_word.py
      # Tabel #J 2-6 kolom terakit lewat Word asli (lebar kolom pecahan); tanpa Word = lewati.
      - run: python .github/uji_tabel_word.py
      # #G masuk DOCX dan dikecilkan ke halaman; @malahiq: akhir mencetak الملاحق sesudah المصادر; tanpa Word = lewati.
      - run: python .github/uji_gambar_word.py
      # Kata Latin di tengah teks Arab (paragraf, #J, catatan kaki, المصادر) = Times New Roman berukuran sebanding; tanpa Word = lewati.
      - run: python .github/uji_latin_word.py
      # Rumus LaTeX (#E dan {E:…}) -> OMML XML sah, fuzzing 300x, @angka/@format, GAGAL sintaks, dan sub-bagian tunggal.
      - run: python .github/uji_rumus.py
      # #E dan {E:…} (paragraf, tabel #J, catatan kaki) jadi OMML asli di DOCX/PDF lewat Word + `pratinjau`; tanpa Word = lewati.
      - run: python .github/uji_rumus_word.py
      # `pratinjau`: PDF -> grid PNG 2×2 dan 1 halaman di TEMP tanpa mengotori folder bahts; rentang salah ditolak.
      - run: python .github/uji_pratinjau.py
      # Isi tiap catatan kaki tetap miliknya saat nomor diulang per halaman, juga di potongan --fasl; tanpa Word = lewati.
      - run: python .github/uji_catatan_word.py
      # #Q kutipan blok menjorok kanan-kiri, @anzhur: ينظر di tiap catatan kaki nukilan makna; tanpa Word = lewati.
      - run: python .github/uji_kutipan_word.py
      # Bahts tanpa المصادر/فهرس yang isinya pas memenuhi halaman tidak berakhir dengan halaman kosong; tanpa Word = lewati.
      - run: python .github/uji_akhir_word.py
      - run: python .github/uji_fihris_ayat_word.py
      # @fihris_ayat baris_surah/terbuka, @fihris_hadits titik/huruf, @fihris_alam: nomor, فهرس الآثار/الأماكن/القبائل/الغريب/الأشعار; tanpa Word = lewati.
      - run: python .github/uji_fihris_word.py
      # @ayat_pembuka, @maudhuat_letak: awal (فهرس sebelum المقدمة), @tanpa: anzhur: cek di mana saja, Word-nya lewati tanpa Word.
      - run: python .github/uji_depan_word.py
      # @templat: penanda «عنوان البحث» di kepala halaman diganti @judul; sampul yang meluap tetap utuh + PERINGATAN; tanpa Word = lewati.
      - run: python .github/uji_templat_word.py
      # tiap @kepala (judul bagian berjalan, ganjil/genap tanpa halaman sisipan, nomor di kepala/kaki) dan garis pemisah catatan kaki 4,5 cm; tanpa Word = lewati.
      - run: python .github/uji_kepala_word.py
      # @judul_fasl pemisah/pemisah_bingkai/kotak, @sampul kop/tanpa_kop, @tamma, @pustaka_gaya: judul_tebal, @maudhuat: titik; tanpa Word = lewati.
      - run: python .github/uji_judul_word.py
      # `halaman` dan `cari` mencetak isi halaman yang diminta (kitab buatan + kitab CI); berkas tulisan mesin mengikuti umask (bukan 0600)
      - run: python .github/uji_halaman.py
      # `takhrij`/`tafsir` tanpa internet: nomor halaman Shamela dari indeks (bukan urutan rekaman), indeks lama dibangun ulang
      - run: python .github/uji_layanan.py
      # `peta`, `edisi` lintas-katalog Shamela/Waqfeya, dan qarinah sanad pada `rawi` (offline)
      - run: python .github/uji_peta_edisi_sanad.py
      # `halaman` tanpa «\r» mentah (kata tersambung saat disalin); argumen/bendera berlebih ditolak, bukan ditelan
      - run: python .github/uji_perintah.py
      - run: python .github/uji_diagram.py
      # sisipan #D: GAGAL data salah; contoh `tanda` tergambar (Node.js + Chrome bawaan runner) jadi PNG 300 dpi rapat
      - run: python .github/uji_sisipan.py
      # kitab Waqfeya tiruan (tanpa internet): `cek` tidak menilai lafaz OCR, GAGAL hanya yang pasti salah; nomor cetak dari baris nomor saja
      - run: python .github/uji_waqfeya.py
      # opencode.json = salinan terpaksa .mcp.json (OpenCode tidak membaca .mcp.json): daftar connector harus sama
      - name: connector opencode.json sama dengan .mcp.json
        run: python -c "import json; a={k:v['url'] for k,v in json.load(open('.mcp.json', encoding='utf-8'))['mcpServers'].items()}; b={k:v['url'] for k,v in json.load(open('opencode.json', encoding='utf-8'))['mcp'].items()}; assert a==b, (a,b)"
      # README.id.md dan README.ar.md = terjemahan README.md: bagian dan tautan relatifnya harus sama
      - run: python .github/uji_readme.py
      # dok/mutamad.md, tautan/path dok & README, dan skema mesin/format.json terhadap olah.py
      - run: python .github/uji_dok.py
      # gerbang bug (aturan di .ruff.toml; `ruff check` tanpa --config memakainya juga)
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.5 check --no-cache .
      # rakit.ps1 (dan skrip yang di-dot-source-nya) tidak bisa dijalankan tanpa Word; minimal harus terurai oleh Windows PowerShell 5.1 milik pemakai
      - name: urai rakit.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $galat = $null
          foreach ($f in Get-ChildItem mesin\*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$galat) | Out-Null
            if ($galat) { $galat | ForEach-Object { "$($f.Name) $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
          # PowerShell 5.1 membaca .ps1 tanpa BOM sebagai ANSI: huruf Arab di dalamnya rusak diam-diam
          foreach ($f in Get-ChildItem mesin\*.ps1) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            if (($b | Where-Object { $_ -gt 127 }) -and -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { "$($f.Name) berhuruf non-ASCII tanpa BOM"; exit 1 }
          }
      - name: startup rakit tidak menghentikan Word aplikasi lain
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/uji_word_startup.ps1
