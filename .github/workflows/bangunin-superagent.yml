name: Bangunin superagent

# Sandbox Instabox tidur setelah 30 menit diam; mention dari pemilik ngebangunin dia biar tiketnya kebaca.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  bangunin:
    if: >-
      github.actor == 'Farisarditiyanto' &&
      (contains(github.event.issue.body, '@muhammadarditianto') ||
       contains(github.event.comment.body, '@muhammadarditianto'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Bangunin sandbox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: >-
          curl -fsS -o /dev/null --max-time 60 --retry 3 -X POST
          -H "Authorization: Bearer $INSTABOX_API_KEY"
          https://api.instabox.sh/v1/machines/m_agqv2qygixj3goiactt5ujzheq/wake
